name: i-Incubator Healthcare
description: 'i-Incubator Healthcare is a pharmaceutical innovation incubator established by IDG Capital
  and officially launched in Shanghai (Xuhui District) in 2024. It operates an "incubation + empowerment"
  model to develop innovative drug-research programs across oncology, immunology, and metabolic disease
  areas, pairing global innovation perspectives with China-based execution to advance projects to
  international quality standards. It is backed by a dedicated, long-horizon (15-year) incubation fund.
  Surfaced as a portfolio company of idg-capital; this is a research/biotech venture with no public
  developer or API surface.'
